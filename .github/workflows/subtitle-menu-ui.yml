name: Subtitle menu UI

on:
  push:
    branches: [improve-subtitle-menu]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/nuvio-ui-test" --no-save playwright@1.56.1
          "$RUNNER_TEMP/nuvio-ui-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check the actual player menu and capture review images
        env:
          NODE_PATH: ${{ runner.temp }}/nuvio-ui-test/node_modules
          NUVIO_UI_SCREENSHOTS: ${{ runner.temp }}/subtitle-menu-screenshots
        run: node scripts/test_player_subtitle_menu.cjs
      - uses: actions/upload-artifact@v7
        with:
          name: subtitle-menu-screenshots
          path: ${{ runner.temp }}/subtitle-menu-screenshots/
          if-no-files-found: error
          retention-days: 14
